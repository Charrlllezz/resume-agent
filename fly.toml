# fly launch --no-deploy will rewrite app/region; the rest is deliberate.
app = "resume-agent"
primary_region = "sjc"

[build]

[env]
  RESUME_AGENT_HOSTED = "1"
  # Chromium is the memory hog here, and each concurrent run holds one. Two at
  # a time fits comfortably in 1GB; raise this only with the memory to match.
  MAX_CONCURRENT_RUNS = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero. Fly bills stopped machines for their rootfs only (cents a
  # month), so an idle deployment is effectively free -- but sessions live in
  # the machine's memory, so a stop signs out whoever was on it. That is the
  # trade: an idle user re-enters their API key, and nobody pays for a warm
  # machine nobody is using. Set this to 1 to keep one warm (~$5.70/month).
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    # A run occupies a thread for 40-90s. Admitting far more than the worker
    # has threads just queues them inside one machine instead of starting
    # another.
    soft_limit = 6
    hard_limit = 12

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
