# fly launch --no-deploy will rewrite app/region; the rest is deliberate.
app = "charles-resume-agent"
primary_region = "sjc"

[build]

[env]
  RESUME_AGENT_HOSTED = "1"
  # Chromium is the memory hog here, and each concurrent run holds one. Two at
  # a time fits comfortably in 1GB; raise this only with the memory to match.
  MAX_CONCURRENT_RUNS = "2"

  # One honest session is 4 actions: one resume upload plus three runs. Six
  # leaves room for a first-timer who uploads the wrong file, while making an
  # incognito reset of the per-session counter buy almost nothing -- the
  # session limit is a cookie, so this is the cap that actually binds.
  FREE_ACTIONS_PER_IP = "6"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays warm (~$5.70/month) so a session survives the minutes
  # someone spends reading a result before their next click -- a stop mid-review
  # used to silently drop them back to the sign-in page with no explanation.
  # Fly can still start a second machine under real concurrent load; it is
  # only the *idle* stop this disables. Set back to 0 to scale fully to zero
  # and accept that trade again; the 401 handler explains it either way.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    # A run occupies a thread for 40-90s. Admitting far more than the worker
    # has threads just queues them inside one machine instead of starting
    # another.
    soft_limit = 6
    hard_limit = 12

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
